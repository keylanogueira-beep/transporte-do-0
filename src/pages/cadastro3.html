<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Passo 3</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>

<main class="auth-page">
    <section class="auth-card">

        <header class="card-top">
            <div>
                <h1>Criar Conta</h1>
                <p>Passo 3 de 3</p>
            </div>

             <button type="button" class="close-btn"
                onclick="window.location.href='index.html'">
                ×
            </button>
            
        </header>

        <div class="plan-badge">
            <span>Plano selecionado:</span>
            <strong>carregando...</strong>
        </div>

        <form id="cadastroPasso3">

            <label class="form-field password-field">
                <span>Senha</span>

                <div class="password-input-wrapper">
                    <input type="password" name="senha" required>

                    <button type="button"
                        class="password-toggle"
                        data-target="senha">
                        Mostrar
                    </button>
                </div>
            </label>

            <label class="form-field password-field">
                <span>Confirmar senha</span>

                <div class="password-input-wrapper">
                    <input type="password" name="senhaConfirm" required>

                    <button type="button"
                        class="password-toggle"
                        data-target="senhaConfirm">
                        Mostrar
                    </button>
                </div>
            </label>

            <p id="passwordError" class="field-error"></p>

            <div class="info-card">
                <p><strong>Conta para Instituição:</strong> Use para gerenciar rotas privadas.</p>
                <p><strong>Usuários comuns:</strong> podem usar busca por CPF na home.</p>
            </div>

            <div class="step-actions">

                <button type="button" id="btnVoltarPasso2" class="back-btn">
                    Voltar
                </button>

                <button type="submit" class="submit-btn">
                    Criar Conta
                </button>

            </div>

        </form>

        <div class="forgot-password">
            <p>
                Já possui conta?
                <a href="login.html">Entrar</a>
            </p>
        </div>

    </section>
</main>

<script src="../js/acessibilidade.js"></script>
<script src="../js/cadastro3.js"></script>

</body>
</html>
