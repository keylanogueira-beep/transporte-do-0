<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="auth-page">
        <section class="auth-card">
            <header class="card-top">
                <div>
                    <h1>Entrar</h1>
                    <p>Faça login para acessar sua conta Premium e continuar usando as rotas privadas.</p>
                </div>
                <button type="button" class="close-btn" aria-label="Fechar" onclick="fecharLogin();">×</button>
            </header>

            <div id="loginAvisoPremium" class="info-card">
                <p>
                    Este acesso é somente para usuários com plano Premium.
                    Pessoas comuns não precisam criar conta para usar o serviço público.
                </p>
            </div>

            <form id="formLogin" class="auth-form" action="#" method="post">

                <label class="form-field">
                    <span>CPF</span>
                    <input type="text" placeholder="000.000.000-00" name="cpf" required>
                </label>

                <label class="form-field">
                    <span>Senha</span>
                    <input type="password" placeholder="••••••••••••" name="senha" required>
                </label>

                <button class="submit-btn" type="submit">
                    Entrar
                </button>

                <div class="forgot-password">
                    <a href="recuperacao_email.html">Esqueceu a senha?</a>
                </div>

            </form>
        </section>
    </main>

    <script src="../js/login.js"></script>
    <script src="../js/acessibilidade.js"></script>
</body>
</html>
